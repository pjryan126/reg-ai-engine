[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reg-ai-engine"
version = "0.1.0"
description = "Air-gapped, zero-egress AI execution & evaluation engine for audited enterprise environments."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Patrick Ryan" }
]
keywords = ["air-gapped", "enterprise-ai", "asyncio"]

# Core runtime dependencies will be added iteratively per module
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

# ------------------------------------------------------------------------------
# Tool Configurations
# ------------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "B",   # bugbear
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
